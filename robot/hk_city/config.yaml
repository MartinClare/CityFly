topic: hk_city
display_name: Hong Kong City-Change Magazine
timezone: Asia/Hong_Kong
report_language: zh-HK
news_limit: 160
max_article_drafts: 12
ledger_lookback_days: 45

pillars:
  - id: property
    label: 樓市與生活
  - id: city
    label: 城市大變身
  - id: mobility
    label: 基建與交通
  - id: economy
    label: 經濟、錢與機會
  - id: tech
    label: 科技改變生活

collectors:
  gov_news:
    limit: 50
    feeds:
      - name: GIS 新聞公報
        url: https://www.info.gov.hk/gia/general/today.htm
