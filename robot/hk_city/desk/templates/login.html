{% extends "base.html" %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1>City Fly 審稿</h1>
    <p class="sub">香港城市變化雜誌 · 編輯室。唔會自動上 Facebook 或公開網站。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">帳戶</label>
        <input id="username" name="username" type="text" value="editor" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" style="width:100%">登入</button>
    </form>
  </div>
</div>
{% endblock %}
